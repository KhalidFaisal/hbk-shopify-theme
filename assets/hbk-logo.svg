<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF2A4D" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Monster Body (Iconic dome shape) -->
  <path d="M 45 170 L 45 95 C 45 42 70 28 100 28 C 130 28 155 42 155 95 L 155 170 Z" 
        fill="#82C341" stroke="#111111" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Horns / Spikes -->
  <path d="M 52 50 L 32 30 L 58 40 Z" fill="#D7FE03" stroke="#111111" stroke-width="5"/>
  <path d="M 148 50 L 168 30 L 142 40 Z" fill="#D7FE03" stroke="#111111" stroke-width="5"/>

  <!-- Eyes -->
  <ellipse cx="76" cy="74" rx="10" ry="14" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
  <ellipse cx="124" cy="74" rx="10" ry="14" fill="#FFFFFF" stroke="#111111" stroke-width="6"/>
  <circle cx="78" cy="74" r="5" fill="#111111"/>
  <circle cx="122" cy="74" r="5" fill="#111111"/>

  <!-- Wide Monster Mouth -->
  <path d="M 60 102 C 75 118 125 118 140 102 C 144 116 138 130 100 130 C 62 130 56 116 60 102 Z" 
        fill="#111111" stroke="#111111" stroke-width="5"/>

  <!-- Monster Sharp Teeth -->
  <polygon points="68,103 76,112 84,103" fill="#FFFFFF"/>
  <polygon points="86,103 94,113 102,103" fill="#FFFFFF"/>
  <polygon points="104,103 112,113 120,103" fill="#FFFFFF"/>
  <polygon points="122,103 130,112 138,103" fill="#FFFFFF"/>

  <!-- Broken Heart held by monster -->
  <g filter="url(#neon-glow)">
    <!-- Left Half of Heart -->
    <path d="M 100 135 C 90 120 70 120 62 132 C 54 144 64 162 100 184 L 97 165 L 104 152 Z" 
          fill="#FF2A4D" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
    <!-- Right Half of Heart -->
    <path d="M 100 135 C 110 120 130 120 138 132 C 146 144 136 162 100 184 L 103 165 L 96 152 Z" 
          fill="#FF2A4D" stroke="#111111" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- HBK Lettering on Heart -->
  <text x="100" y="162" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="16" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5" stroke="#111111" stroke-width="3" paint-order="stroke fill">
    HBK
  </text>

  <!-- Monster Paws holding the heart -->
  <ellipse cx="62" cy="154" rx="10" ry="7" fill="#82C341" stroke="#111111" stroke-width="5"/>
  <ellipse cx="138" cy="154" rx="10" ry="7" fill="#82C341" stroke="#111111" stroke-width="5"/>
</svg>
